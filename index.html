<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entreno en Casa</title>
<meta name="description" content="Registro de entrenamiento en casa con mancuernas y barra.">
<meta name="theme-color" content="#F4C430">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-ruler" viewBox="0 0 24 24"><rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M6.5 8v3M10 8v4.5M13.5 8v3M17 8v4.5"/></symbol>
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="8" rx="1.5"/><path d="M7 14h10v6.5H7z"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="3"/><path d="m10 9 5 3-5 3z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 5 4 9l4 4"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5h4"/></symbol>
</svg>

<main id="app" class="wrap"></main>

<nav class="tabbar" aria-label="Secciones">
  <a href="#inicio"><svg class="ic"><use href="#i-home"/></svg><span>Inicio</span></a>
  <a href="#historial"><svg class="ic"><use href="#i-history"/></svg><span>Historial</span></a>
  <a href="#medidas"><svg class="ic"><use href="#i-ruler"/></svg><span>Medidas</span></a>
  <a href="#imprimir"><svg class="ic"><use href="#i-print"/></svg><span>Imprimir</span></a>
</nav>

<div id="timer" class="timer" hidden role="dialog" aria-modal="true" aria-labelledby="t-label">
  <p class="timer-label" id="t-label">Descanso</p>
  <div class="timer-num" id="t-num" aria-live="off">0:00</div>
  <div class="timer-track"><div class="timer-bar" id="t-bar"></div></div>
  <div class="timer-btns">
    <button class="btn" data-act="t-minus">−15 s</button>
    <button class="btn" data-act="t-plus">+15 s</button>
  </div>
  <button class="btn btn-primary" data-act="t-skip" id="t-skip">Saltar</button>
  <p class="timer-next" id="t-next"></p>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
